name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research-pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified tag
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.11.16
      - name: Install locked environment
        run: uv sync --locked --extra dev --python "$(command -v python)"
      - name: Lint
        run: uv run ruff check src tests
      - name: Formatting
        run: uv run ruff format --check src tests
      - name: Check core interface types
        run: uv run mypy
      - name: Unit and isolated train-evaluate-report smoke tests
        run: uv run pytest -q
