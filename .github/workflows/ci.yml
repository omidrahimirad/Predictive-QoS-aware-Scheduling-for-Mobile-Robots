name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research-pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked environment
        run: uv sync --locked --extra dev --python "$(command -v python)"
      - name: Lint
        run: uv run ruff check src tests
      - name: Formatting
        run: uv run ruff format --check src tests
      - name: Check core interface types
        run: uv run mypy
      - name: Unit and isolated train-evaluate-report smoke tests
        run: uv run pytest -q
