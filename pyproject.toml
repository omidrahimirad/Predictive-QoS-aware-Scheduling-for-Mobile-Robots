[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predictive-qos"
version = "0.1.0"
description = "Reproducible NR-inspired mobile-robot scheduling research simulator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "PyYAML>=6,<7", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9", "mypy>=1.10", "types-PyYAML", "pandas-stubs"]

[project.scripts]
pqos = "pqos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pqos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/pqos/config.py", "src/pqos/entities.py", "src/pqos/schedulers"]
ignore_missing_imports = true
check_untyped_defs = true

